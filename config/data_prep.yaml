hydra:
  run:
    dir: outputs/data_prep/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Data file path (relative to project root)
data:
  train_file: data/train.csv
  
# Split ratios for train, val, test
splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Limit number of rows to work with
# -1 or null means work with full data
data_limit: 10000

# Random seed for reproducibility
random_seed: 42
