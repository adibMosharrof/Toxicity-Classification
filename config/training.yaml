# Training Configuration
defaults:
  - _self_
  # - model: distilbert
  - model: custom_transformer
  - loss: bce

hydra:
  run:
    dir: outputs/training/${now:%Y-%m-%d}/${now:%H-%M-%S}
  
project_root: /u/siddique-d1/adib/jigsaw

# Data settings
data:
  directory: outputs/data_prep/2026-02-14/16-46-17
  train_file: train_split.csv
  val_file: val_split.csv
  
# Training hyperparameters
training:
  num_epochs: 1
  learning_rate: 2e-5
  warmup_steps: 500
  weight_decay: 0.01
  early_stopping_patience: 3
  eval_steps: 50
  save_steps: 50

# Weights & Biases (wandb) configuration
wandb:
  enabled: true
  project: "jigsaw-toxicity"
  entity: null  # Set to your wandb username/team if needed
  name: null    # Auto-generated from timestamp if null
  notes: "Training distilbert model for toxicity classification"
  tags: ["toxicity", "classification", "distilbert"]

# Run inference on test set after training
should_run_inference: true

# Inference settings (used for post-training evaluation)
inference:
  threshold: 0.5

# Random seed for reproducibility
random_seed: 42
