name: custom_transformer_preln
backbone_type: custom_transformer
threshold: 0.5
max_length: 256
tokenizer_name: distilbert-base-uncased  # For loading the HuggingFace tokenizer

# Model architecture hyperparameters
architecture:
  vocab_size: 30522
  d_model: 256
  num_heads: 4
  d_ff: 1024
  num_layers: 6
  dropout: 0.1
  classification_hidden_dim: 512

# Training-specific hyperparameters
train:
  batch_size: 512
  eval_batch_size: 1024
  gradient_accumulation_steps: 2

# Inference-specific hyperparameters
inference:
  batch_size: 1024
