[project]
name = "jigsaw"
version = "0.1.0"
description = "Robust Toxicity Classification with Custom Transformer"
authors = [
    {name = "Your Name"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch (>=2.10.0,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "transformers (>=5.1.0,<6.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
